name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.5.5)'
        required: true
        default: 'v1.5.5'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: compute changelog since previous tag
        id: changelog
        shell: bash
        run: |
          set -e
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${{ env.RELEASE_TAG }}$" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            COMMITS="- first public release 🐙"
            DIFF_URL=""
          else
            COMMITS=$(git log "$PREV_TAG..${{ env.RELEASE_TAG }}" --pretty=format:'- %s' --no-merges --reverse)
            if [ -z "$COMMITS" ]; then
              COMMITS="- (no commit changes since $PREV_TAG — version bump only)"
            fi
            DIFF_URL="full diff: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ env.RELEASE_TAG }}"
          fi
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "COMMITS<<COMMITS_EOF"
            echo "$COMMITS"
            echo "COMMITS_EOF"
            echo "DIFF_URL=$DIFF_URL"
          } >> "$GITHUB_OUTPUT"

      - name: resolve release body
        id: release_body
        shell: bash
        env:
          COMMITS: ${{ steps.changelog.outputs.COMMITS }}
          DIFF_URL: ${{ steps.changelog.outputs.DIFF_URL }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          set -e
          NOTES_FILE="docs/release-notes/${TAG_NAME}.md"
          {
            echo "BODY<<BODY_EOF"
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
            else
              printf '# %s\n\n' "$TAG_NAME"
              printf '## What changed\n\n%s\n\n%s\n\n' "$COMMITS" "$DIFF_URL"
              printf '## Install\n\n'
              printf '**macOS Apple Silicon**: `marka.md.dmg`\n'
              printf '**macOS Intel**: `marka.md_intel.dmg`\n'
              printf '**Windows**: `marka.md_*-setup.exe`\n'
              printf '**Linux**: pick `.AppImage`, `.deb`, or `.rpm`\n\n'
              printf 'Existing users on auto-update get this on next launch.\n'
            fi
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: install linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: install dependencies
        run: bun install

      - name: disable updater artifact signing (no signing key required)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            cfg.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2));
          "

      - name: import apple cert + propagate signing env (macOS only)
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "marka.md ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ steps.release_body.outputs.BODY }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: rename dmg → marka.md.dmg (apple silicon)
        if: matrix.target == 'aarch64-apple-darwin' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name == "${{ env.RELEASE_TAG }}") | .id' | head -1)
          if [ -z "$RELEASE_ID" ]; then
            echo "no release found for tag ${{ env.RELEASE_TAG }} — skipping rename"
            exit 0
          fi
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[] | select(.name | test("aarch64.*\\.dmg$")) | .id' | head -1)
          if [ -n "$ASSET_ID" ]; then
            echo "renaming aarch64 dmg asset $ASSET_ID → marka.md.dmg"
            gh api "repos/${{ github.repository }}/releases/assets/$ASSET_ID" -X PATCH -f name='marka.md.dmg'
          else
            echo "no aarch64 dmg asset found — skipping rename"
          fi

      - name: rename dmg → marka.md_intel.dmg (intel)
        if: matrix.target == 'x86_64-apple-darwin' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name == "${{ env.RELEASE_TAG }}") | .id' | head -1)
          if [ -z "$RELEASE_ID" ]; then
            echo "no release found for tag ${{ env.RELEASE_TAG }} — skipping rename"
            exit 0
          fi
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[] | select(.name | test("x64.*\\.dmg$")) | .id' | head -1)
          if [ -n "$ASSET_ID" ]; then
            echo "renaming intel dmg asset $ASSET_ID → marka.md_intel.dmg"
            gh api "repos/${{ github.repository }}/releases/assets/$ASSET_ID" -X PATCH -f name='marka.md_intel.dmg'
          else
            echo "no dmg asset found — skipping rename"
          fi

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "publishing draft release for ${{ env.RELEASE_TAG }}"
          gh release edit "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest

  notify-site:
    needs: publish-release
    runs-on: ubuntu-latest
    env:
      HAS_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
    steps:
      - name: ping vercel deploy hook
        if: env.HAS_HOOK == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "triggering markamd-site rebuild"
          curl -fsS -X POST "$DEPLOY_HOOK"
      - name: no hook configured
        if: env.HAS_HOOK != 'true'
        run: echo "VERCEL_DEPLOY_HOOK secret not set — skipping site rebuild"
